# Бот + Mini App + Caddy (автоматический HTTPS от Let's Encrypt).
# Запуск: заполните .env (BOT_TOKEN, WEBAPP_URL, DOMAIN) и выполните  docker compose up -d --build
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - bot-data:/data
      - ./secrets:/secrets:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bot-data:
  caddy-data:
  caddy-config:

# Команда IAC Media. Файл читается только при первом запуске (когда в базе ещё нет участников).
# Дальше команду удобнее менять в Mini App → «Команда».
#
# name      — имя так, как оно пишется в колонке «Ответственный» таблицы
# username  — Telegram-ник без @ (по нему бот узнаёт человека, когда тот нажмёт /start)
# aliases   — другие написания имени в таблице через запятую (латиница, фамилия и т.п.)
# admin     — может загружать таблицы, создавать и редактировать любые задачи
# pm        — получает эскалации: просрочки, «нужна помощь», утренний список обзвона
# assists   — ник участника, чьи задачи этот человек выполняет вместе с ним (те же задачи и напоминания)
# observer  — наблюдатель: видит все задачи и обзвон, получает утреннюю сводку, ничего не меняет

members:
